<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆阻尼仿真器 · Week 05</title>
<style>
  :root {
    --bg: #1a1a24;
    --cyan: #4fd6ff;
    --violet: #8b7cff;
    --text: #cfd6e6;
    --dim: #6b7590;
    --mono: "Cascadia Mono", "Consolas", "SF Mono", monospace;
    --sans: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  #stage { position: fixed; inset: 0; display: block; cursor: grab; }
  #stage.dragging { cursor: grabbing; }

  .panel {
    position: fixed;
    z-index: 2;
    pointer-events: none;
    user-select: none;
  }

  #title { top: 26px; left: 30px; }
  #title h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #eaf2ff;
  }
  #title h1 span { color: var(--cyan); }
  #title p {
    margin-top: 7px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 1.2px;
    color: var(--dim);
  }
  #title .formula {
    margin-top: 11px;
    padding: 7px 11px;
    border-left: 2px solid var(--violet);
    background: rgba(139, 124, 255, 0.07);
    font-family: var(--mono);
    font-size: 12px;
    color: #a9b6d4;
    letter-spacing: 0.4px;
  }

  #hud {
    top: 26px;
    right: 30px;
    min-width: 218px;
    padding: 15px 17px;
    border: 1px solid rgba(79, 214, 255, 0.16);
    border-radius: 9px;
    background: rgba(14, 15, 22, 0.62);
    backdrop-filter: blur(7px);
  }
  #hud .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 4.5px 0;
    font-family: var(--mono);
    font-size: 12px;
  }
  #hud .row span:first-child { color: var(--dim); letter-spacing: 0.6px; }
  #hud .row span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
  #hud .val-cyan { color: var(--cyan) !important; }
  #hud .divider {
    margin: 8px 0 6px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
  }
  #status {
    margin-top: 10px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2.5px;
    color: #0d1018;
    background: var(--cyan);
    border-radius: 4px;
    padding: 3.5px 0;
  }
  #status.paused { background: #ffb648; }

#hint {
    left: 50%;
    bottom: 122px;
    transform: translateX(-50%);
    padding: 9px 19px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    background: rgba(14, 15, 22, 0.55);
    font-size: 11.5px;
    letter-spacing: 0.8px;
    color: var(--dim);
    white-space: nowrap;
  }
  #hint b { color: var(--cyan); font-weight: 600; }

  #controls {
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 20px;
    max-width: min(94vw, 880px);
    padding: 14px 20px;
    border: 1px solid rgba(79, 214, 255, 0.16);
    border-radius: 11px;
    background: rgba(14, 15, 22, 0.72);
    backdrop-filter: blur(7px);
    pointer-events: auto;
  }
  #controls .ctrl {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #controls label {
    font-size: 11.5px;
    letter-spacing: 0.8px;
    color: var(--dim);
    white-space: nowrap;
  }
  #controls label .unit {
    font-family: var(--mono);
    font-style: italic;
    color: var(--violet);
  }
  #controls output {
    min-width: 62px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--cyan);
    font-variant-numeric: tabular-nums;
  }
  #controls input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 116px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(79, 214, 255, 0.5), rgba(139, 124, 255, 0.32));
    cursor: pointer;
    outline: none;
  }
  #controls input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #eaf6ff;
    box-shadow: 0 0 8px rgba(79, 214, 255, 0.85);
    cursor: pointer;
  }
  #controls input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border: none;
    border-radius: 50%;
    background: #eaf6ff;
    box-shadow: 0 0 8px rgba(79, 214, 255, 0.85);
    cursor: pointer;
  }
  #controls input[type="range"]::-moz-range-track {
    background: transparent;
  }
  #controls input[type="range"]:focus-visible {
    box-shadow: 0 0 0 2px rgba(79, 214, 255, 0.45);
  }
  #btnReset {
    padding: 7px 16px;
    border: 1px solid rgba(79, 214, 255, 0.4);
    border-radius: 6px;
    background: rgba(79, 214, 255, 0.08);
    color: var(--cyan);
    font-family: var(--sans);
    font-size: 11.5px;
    letter-spacing: 1.2px;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
  }
  #btnReset:hover {
    background: rgba(79, 214, 255, 0.18);
    box-shadow: 0 0 12px rgba(79, 214, 255, 0.28);
  }
  #btnReset:active { background: rgba(79, 214, 255, 0.3); }
  #btnReset:focus-visible { outline: 2px solid rgba(79, 214, 255, 0.5); outline-offset: 2px; }

  #footer {
    left: 30px;
    bottom: 28px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.9px;
    color: #4a5468;
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="panel" id="title">
  <h1>单摆仿真器 <span>·</span> PENDULUM</h1>
  <p>WEEK 05 / 南昌大学 · 人类与人工智能编程</p>
  <div class="formula">&theta;&Prime; = &minus;(g / L) &middot; sin&thinsp;&theta;</div>
</div>

<div class="panel" id="hud">
  <div class="row"><span>摆角 &theta;</span><span class="val-cyan" id="vTheta">0.00&deg;</span></div>
  <div class="row"><span>角速度 &omega;</span><span id="vOmega">0.000 rad/s</span></div>
  <div class="row"><span>摆长 L</span><span id="vLen">200 px</span></div>
  <div class="row"><span>重力 g</span><span id="vGrav">9.8 m/s&sup2;</span></div>
  <div class="row"><span>阻尼 b</span><span id="vDamp">0.0030</span></div>
  <div class="divider"></div>
  <div class="row"><span>理论周期 T</span><span id="vPeriod">2.007 s</span></div>
  <div class="row"><span>衰减时间 &tau;</span><span id="vTau">11.1 s</span></div>
  <div class="row"><span>总能量 E</span><span id="vEnergy">0.00</span></div>
  <div class="row"><span>能量漂移</span><span id="vDrift">0.000 %</span></div>
  <div class="row"><span>仿真时刻 t</span><span id="vTime">0.00 s</span></div>
  <div id="status">RUNNING</div>
</div>

<div class="panel" id="hint">
  <b>拖拽</b> 摆球改变摆角 &nbsp;&middot;&nbsp; <b>单击</b> 暂停 / 继续 &nbsp;&middot;&nbsp; <b>R</b> 复位
</div>

<div class="panel" id="controls">
  <div class="ctrl">
    <label for="sLen">摆长 <span class="unit">L</span></label>
    <input type="range" id="sLen" min="100" max="350" step="1" value="200">
    <output id="oLen">200 px</output>
  </div>
  <div class="ctrl">
    <label for="sGrav">重力 <span class="unit">g</span></label>
    <input type="range" id="sGrav" min="1" max="25" step="0.1" value="9.8">
    <output id="oGrav">9.8</output>
  </div>
  <div class="ctrl">
    <label for="sDamp">阻尼 <span class="unit">b</span></label>
    <input type="range" id="sDamp" min="0" max="0.01" step="0.0001" value="0.003">
    <output id="oDamp">0.0030</output>
  </div>
  <button id="btnReset" type="button">重置摆动</button>
</div>

<div class="panel" id="footer">
  邓若馨 &middot; 6108126003 &middot; 纯原生 HTML5 Canvas &middot; 无外部依赖
</div>

<script>
(function () {
  "use strict";

  const BG = "#1a1a24";
  const PX_PER_METER = 200;
  const GRAVITY = 9.8;
  const L_PX_BASE = 200;
  const THETA0 = 45 * Math.PI / 180;
  const SUB_DT = 1 / 600;
  const MAX_FRAME = 0.25;
  const BOB_R = 13;
  const DAMP_GAIN = 60;
  const CYAN = [79, 214, 255];
  const VIOLET = [139, 124, 255];

  const stage = document.getElementById("stage");
  const ctx = stage.getContext("2d");
  const bgCanvas = document.createElement("canvas");
  const bgCtx = bgCanvas.getContext("2d");
  const trailCanvas = document.createElement("canvas");
  const trailCtx = trailCanvas.getContext("2d");

  const el = {
    theta: document.getElementById("vTheta"),
    omega: document.getElementById("vOmega"),
    len: document.getElementById("vLen"),
    grav: document.getElementById("vGrav"),
    damp: document.getElementById("vDamp"),
    period: document.getElementById("vPeriod"),
    tau: document.getElementById("vTau"),
    energy: document.getElementById("vEnergy"),
    drift: document.getElementById("vDrift"),
    time: document.getElementById("vTime"),
    status: document.getElementById("status")
  };

  const ui = {
    len: document.getElementById("sLen"),
    grav: document.getElementById("sGrav"),
    damp: document.getElementById("sDamp"),
    oLen: document.getElementById("oLen"),
    oGrav: document.getElementById("oGrav"),
    oDamp: document.getElementById("oDamp"),
    reset: document.getElementById("btnReset")
  };

  let W = 0, H = 0, dpr = 1;
  let cx = 0, pivotY = 0, Lpx = L_PX_BASE, gPx = GRAVITY * PX_PER_METER, gamma = 0;
  let theta = THETA0, omega = 0, t = 0;
  let running = true, dragging = false;
  let acc = 0, last = 0, energy0 = 0;
  let maxTheta = THETA0;
  let bobX = 0, bobY = 0;
  let omegaNatural = 0, periodTheory = 0;

  const params = { len: L_PX_BASE, grav: GRAVITY, damp: 0.003 };

  function rgba(c, a) {
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
  }

  function maxLength() {
    return Math.max(60, H - pivotY - 58);
  }

  function applyParams() {
    Lpx = Math.min(params.len, maxLength());
    gPx = params.grav * PX_PER_METER;
    gamma = DAMP_GAIN * params.damp;

    omegaNatural = Math.sqrt(gPx / Lpx);
    periodTheory = 2 * Math.PI / omegaNatural;

    el.len.textContent = Math.round(Lpx) + " px";
    el.grav.textContent = params.grav.toFixed(1) + " m/s\u00B2";
    el.damp.textContent = params.damp.toFixed(4);
    el.period.textContent = periodTheory.toFixed(3) + " s";
    el.tau.textContent = gamma > 0 ? (2 / gamma).toFixed(1) + " s" : "\u221E";

    energy0 = totalEnergy();
    updateBob();
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    stage.width = Math.round(W * dpr);
    stage.height = Math.round(H * dpr);
    stage.style.width = W + "px";
    stage.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    bgCanvas.width = stage.width;
    bgCanvas.height = stage.height;
    trailCanvas.width = stage.width;
    trailCanvas.height = stage.height;
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    trailCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    cx = W / 2;
    pivotY = Math.max(H * 0.2, 118);

    paintBackground();
    clearTrail();
    applyParams();
  }

  function paintBackground() {
    const g = bgCtx;
    g.clearRect(0, 0, W, H);
    g.fillStyle = BG;
    g.fillRect(0, 0, W, H);

    const glow = g.createRadialGradient(cx, pivotY, 0, cx, pivotY, Math.max(W, H) * 0.62);
    glow.addColorStop(0, "rgba(79,214,255,0.055)");
    glow.addColorStop(0.45, "rgba(139,124,255,0.028)");
    glow.addColorStop(1, "rgba(26,26,36,0)");
    g.fillStyle = glow;
    g.fillRect(0, 0, W, H);

    g.strokeStyle = "rgba(255,255,255,0.028)";
    g.lineWidth = 1;
    const gap = 46;
    g.beginPath();
    for (let x = (cx % gap); x < W; x += gap) {
      g.moveTo(Math.round(x) + 0.5, 0);
      g.lineTo(Math.round(x) + 0.5, H);
    }
    for (let y = (pivotY % gap); y < H; y += gap) {
      g.moveTo(0, Math.round(y) + 0.5);
      g.lineTo(W, Math.round(y) + 0.5);
    }
    g.stroke();

    g.strokeStyle = "rgba(79,214,255,0.07)";
    g.beginPath();
    g.moveTo(0, Math.round(pivotY) + 0.5);
    g.lineTo(W, Math.round(pivotY) + 0.5);
    g.stroke();
  }

  function clearTrail() {
    trailCtx.clearRect(0, 0, W, H);
  }

  function fadeTrail() {
    trailCtx.globalCompositeOperation = "destination-out";
    trailCtx.fillStyle = "rgba(0,0,0,0.035)";
    trailCtx.fillRect(0, 0, W, H);
    trailCtx.globalCompositeOperation = "source-over";
  }

  function updateBob() {
    bobX = cx + Lpx * Math.sin(theta);
    bobY = pivotY + Lpx * Math.cos(theta);
  }

  function totalEnergy() {
    const kinetic = 0.5 * Lpx * Lpx * omega * omega;
    const potential = gPx * Lpx * (1 - Math.cos(theta));
    return kinetic + potential;
  }

  function reset() {
    theta = THETA0;
    omega = 0;
    t = 0;
    acc = 0;
    maxTheta = THETA0;
    clearTrail();
    updateBob();
    energy0 = totalEnergy();
  }

  function step(h) {
    const alpha = -(gPx / Lpx) * Math.sin(theta) - gamma * omega;
    omega += alpha * h;
    theta += omega * h;
    t += h;
    const a = Math.abs(theta);
    if (a > maxTheta) maxTheta = a;
  }

  function drawLocus() {
    const r = Lpx + BOB_R * 0.6;
    ctx.save();
    ctx.strokeStyle = "rgba(139,124,255,0.13)";
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 7]);
    ctx.beginPath();
    ctx.arc(cx, pivotY, r, Math.PI / 2 - maxTheta - 0.06, Math.PI / 2 + maxTheta + 0.06);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(cx, pivotY);
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.setLineDash([2, 5]);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, Lpx + BOB_R * 2.4);
    ctx.stroke();
    ctx.restore();

    const stopX = cx + Lpx * Math.sin(maxTheta);
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.setLineDash([2, 5]);
    ctx.beginPath();
    ctx.moveTo(cx, pivotY);
    ctx.lineTo(stopX, pivotY + Math.sqrt(Math.max(0, Lpx * Lpx - (stopX - cx) * (stopX - cx))));
    ctx.stroke();
    ctx.restore();
  }

  function drawRod() {
    const grad = ctx.createLinearGradient(cx, pivotY, bobX, bobY);
    grad.addColorStop(0, rgba(VIOLET, 0.75));
    grad.addColorStop(0.55, "rgba(150,170,220,0.5)");
    grad.addColorStop(1, rgba(CYAN, 0.85));

    ctx.save();
    ctx.shadowColor = rgba(CYAN, 0.35);
    ctx.shadowBlur = 9;
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.1;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx, pivotY);
    ctx.lineTo(bobX, bobY);
    ctx.stroke();
    ctx.restore();
  }

  function drawPivot() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const halo = ctx.createRadialGradient(cx, pivotY, 0, cx, pivotY, 22);
    halo.addColorStop(0, rgba(CYAN, 0.30));
    halo.addColorStop(1, rgba(CYAN, 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, pivotY, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.fillStyle = "#dfe9fb";
    ctx.beginPath();
    ctx.arc(cx, pivotY, 3.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgba(CYAN, 0.55);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, pivotY, 6.2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawBob() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    const bloom = ctx.createRadialGradient(bobX, bobY, 0, bobX, bobY, BOB_R * 4.4);
    bloom.addColorStop(0, rgba(CYAN, 0.34));
    bloom.addColorStop(0.35, rgba(CYAN, 0.12));
    bloom.addColorStop(1, rgba(CYAN, 0));
    ctx.fillStyle = bloom;
    ctx.beginPath();
    ctx.arc(bobX, bobY, BOB_R * 4.4, 0, Math.PI * 2);
    ctx.fill();

    const inner = ctx.createRadialGradient(bobX - BOB_R * 0.3, bobY - BOB_R * 0.35, 0, bobX, bobY, BOB_R);
    inner.addColorStop(0, "rgba(255,255,255,0.95)");
    inner.addColorStop(0.32, rgba(CYAN, 0.92));
    inner.addColorStop(1, rgba(VIOLET, 0.72));
    ctx.fillStyle = inner;
    ctx.beginPath();
    ctx.arc(bobX, bobY, BOB_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.arc(bobX, bobY, BOB_R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bgCanvas, 0, 0, W, H);
    ctx.drawImage(trailCanvas, 0, 0, W, H);
    drawLocus();
    drawPivot();
    drawRod();
    drawBob();
  }

  function stampTrail() {
    trailCtx.save();
    trailCtx.globalCompositeOperation = "lighter";
    const g = trailCtx.createRadialGradient(bobX, bobY, 0, bobX, bobY, BOB_R * 1.75);
    g.addColorStop(0, rgba(CYAN, 0.34));
    g.addColorStop(1, rgba(CYAN, 0));
    trailCtx.fillStyle = g;
    trailCtx.beginPath();
    trailCtx.arc(bobX, bobY, BOB_R * 1.75, 0, Math.PI * 2);
    trailCtx.fill();
    trailCtx.restore();
  }

  function syncHud() {
    const e = totalEnergy();
    const drift = energy0 > 0 ? ((e - energy0) / energy0) * 100 : 0;
    el.theta.textContent = (theta * 180 / Math.PI).toFixed(2) + "\u00B0";
    el.omega.textContent = omega.toFixed(3) + " rad/s";
    el.energy.textContent = e.toFixed(2);
    el.drift.textContent = (drift >= 0 ? "+" : "") + drift.toFixed(3) + " %";
    el.time.textContent = t.toFixed(2) + " s";
  }

  function frame(now) {
    if (!last) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > MAX_FRAME) dt = MAX_FRAME;

    if (running && !dragging) {
      acc += dt;
      while (acc >= SUB_DT) {
        step(SUB_DT);
        acc -= SUB_DT;
      }
      updateBob();
      stampTrail();
    }

    fadeTrail();
    render();
    syncHud();
    requestAnimationFrame(frame);
  }

  function setRunning(v) {
    running = v;
    el.status.textContent = v ? "RUNNING" : "PAUSED";
    el.status.className = v ? "" : "paused";
  }

  function angleAt(clientX, clientY) {
    return Math.atan2(clientX - cx, clientY - pivotY);
  }

  function pointerDown(e) {
    dragging = true;
    stage.classList.add("dragging");
    stage.setPointerCapture(e.pointerId);
    theta = angleAt(e.clientX, e.clientY);
    omega = 0;
    maxTheta = Math.max(maxTheta, Math.abs(theta));
    updateBob();
  }

  function pointerMove(e) {
    if (!dragging) return;
    theta = angleAt(e.clientX, e.clientY);
    omega = 0;
    maxTheta = Math.max(maxTheta, Math.abs(theta));
    updateBob();
  }

  function pointerUp(e) {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove("dragging");
    if (stage.hasPointerCapture(e.pointerId)) stage.releasePointerCapture(e.pointerId);
    energy0 = totalEnergy();
  }

  function bindRange(node, key, readout, format) {
    node.addEventListener("input", function () {
      params[key] = parseFloat(node.value);
      readout.textContent = format(params[key]);
      applyParams();
    });
  }

  bindRange(ui.len, "len", ui.oLen, function (v) { return Math.round(v) + " px"; });
  bindRange(ui.grav, "grav", ui.oGrav, function (v) { return v.toFixed(1); });
  bindRange(ui.damp, "damp", ui.oDamp, function (v) { return v.toFixed(4); });

  ui.reset.addEventListener("click", function () {
    reset();
    setRunning(true);
  });

  stage.addEventListener("pointerdown", pointerDown);
  stage.addEventListener("pointermove", pointerMove);
  stage.addEventListener("pointerup", pointerUp);
  stage.addEventListener("pointercancel", pointerUp);

  stage.addEventListener("click", function (e) {
    if (Math.abs(e.clientX - bobX) < BOB_R * 3.2 && Math.abs(e.clientY - bobY) < BOB_R * 3.2) {
      setRunning(!running);
    }
  });

  window.addEventListener("keydown", function (e) {
    if (e.key === "r" || e.key === "R") {
      reset();
      setRunning(true);
    } else if (e.code === "Space") {
      e.preventDefault();
      setRunning(!running);
    }
  });

  window.addEventListener("resize", layout);

  layout();
  reset();
  setRunning(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
